<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    
    <!-- Título e descrição base (serão sobrescritos pelo React Helmet) -->
    <title>Azimut – Immersive • Interactive • Cinematic Experiences</title>
    <meta name="description" content="Experiências imersivas, interativas e cinematográficas para cultura, marcas e espaços híbridos – atuando entre Brasil e Canadá." />
    
    <!-- Favicon - Estrela Azimut -->
    <link rel="icon" type="image/png" sizes="32x32" href="/azimut-star-32.png" />
    <link rel="icon" type="image/svg+xml" href="/logo-azimut-star.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo192.png" />
    
    <!-- Theme color para mobile browsers -->
    <meta name="theme-color" content="#050814" />
    
    <!-- Open Graph base (serão sobrescritos por página) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Azimut" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter Cards base -->
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- ═══════════════════════════════════════════════════════════
        GOOGLE SEARCH CONSOLE VERIFICATION
        ═══════════════════════════════════════════════════════════ -->
    <!-- 
      ⚠️ INSTRUÇÕES PASSO A PASSO:
      
      1. Acesse: https://search.google.com/search-console
      2. Clique em "Adicionar propriedade"
      3. Digite: https://azmt.com.br
      4. Escolha método: "Tag HTML"
      5. Copie o código que aparece (ex: ABC123XYZ789...)
      6. Cole abaixo substituindo "SEU_CODIGO_AQUI"
      7. Salve, faça commit e push
      8. Aguarde deploy (2-3 min)
      9. Volte ao Search Console e clique em "Verificar"
      
      📖 Guia completo: docs/GUIA_PASSO_A_PASSO_GOOGLE_SEARCH_CONSOLE.md
    -->
    <meta name="google-site-verification" content="SEU_CODIGO_AQUI" />
    <!-- 
      ALTERNATIVA: Usar variável de ambiente no Vercel
      Nome: VITE_GOOGLE_SEARCH_CONSOLE_VERIFICATION
      Valor: (cole o código aqui)
      Depois descomente a linha abaixo e remova a linha acima:
    -->
    <!-- <meta name="google-site-verification" content={import.meta.env.VITE_GOOGLE_SEARCH_CONSOLE_VERIFICATION} /> -->
    
    <!-- ═══════════════════════════════════════════════════════════
        PERFORMANCE OPTIMIZATIONS - Resource Hints
        ═══════════════════════════════════════════════════════════ -->
    
    <!-- DNS Prefetch para domínios externos -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://img.youtube.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://plausible.io" />
    
    <!-- Preconnect para recursos críticos -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload de recursos críticos -->
    <link rel="preload" href="/logo-azimut-star.svg" as="image" type="image/svg+xml" />
    <!-- Favicon PNG não precisa de preload - navegador carrega automaticamente -->
    
    <!-- Preload de fontes críticas (melhor LCP) -->
    <link rel="preload" href="/fonts/HandelGothic-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Inter-VariableFont.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Sora-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin />
    
    <!-- Prefetch de rotas prováveis (melhor navegação) -->
    <link rel="prefetch" href="/work" />
    <link rel="prefetch" href="/what" />
    <link rel="prefetch" href="/contact" />
    <link rel="prefetch" href="/academy" />
    <link rel="prefetch" href="/studio" />
    <link rel="prefetch" href="/blog" />
    <link rel="prefetch" href="/vancouver" />
    
    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#c92337" />
    <!-- Novo padrão (recomendado) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Deprecated: mantido para compatibilidade com iOS antigo -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Schema.org JSON-LD será injetado dinamicamente pelo React (SchemaOrganization.tsx) -->
  </head>
  <body class="bg-azimut-bg text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
