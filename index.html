<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    
    <!-- Título e descrição base (serão sobrescritos pelo React Helmet) -->
    <title>Azimut – Immersive • Interactive • Cinematic Experiences</title>
    <meta name="description" content="Experiências imersivas, interativas e cinematográficas para cultura, marcas e espaços híbridos – atuando entre Brasil e Canadá." />
    
    <!-- Favicon - Estrela Azimut -->
    <link rel="icon" type="image/png" sizes="32x32" href="/azimut-star-32.png" />
    <link rel="icon" type="image/svg+xml" href="/logo-azimut-star.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo192.png" />
    
    <!-- Theme color para mobile browsers -->
    <meta name="theme-color" content="#050814" />
    
    <!-- hreflang - versões de idioma (home; demais páginas via SEO.tsx) -->
    <link rel="alternate" hreflang="pt-BR" href="https://azmt.com.br/pt" />
    <link rel="alternate" hreflang="en-US" href="https://azmt.com.br/en" />
    <link rel="alternate" hreflang="es-ES" href="https://azmt.com.br/es" />
    <link rel="alternate" hreflang="fr-FR" href="https://azmt.com.br/fr" />
    <link rel="alternate" hreflang="x-default" href="https://azmt.com.br/en" />
    
    <!-- Open Graph base (serão sobrescritos por página) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Azimut" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter Cards base -->
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- ═══════════════════════════════════════════════════════════
        VERIFICAÇÃO MULTI-BUSCADORES
        ═══════════════════════════════════════════════════════════ -->
    
    <!-- GOOGLE SEARCH CONSOLE (Tag HTML) - https://search.google.com/search-console -->
    <meta name="google-site-verification" content="IZ6_b3UfR19N0MJRaxcIpGcNgbO0-6H9gRvyiRGUX3Y" />
    
    <!-- BING WEBMASTER TOOLS -->
    <!-- 
      ⚠️ INSTRUÇÕES:
      1. Acesse: https://www.bing.com/webmasters
      2. Adicione site: https://azimutimmersive.com (internacional)
      3. Escolha método: "Meta tag"
      4. Código adicionado: 87F8C2FABCDADFCDF6D98DAAC52961CB
      5. Para azimut.com.br, usar método DNS ou XML (não pode ter 2 meta tags)
    -->
    <meta name="msvalidate.01" content="87F8C2FABCDADFCDF6D98DAAC52961CB" />
    
    <!-- YANDEX WEBMASTER (Opcional - para mercado russo/europeu) -->
    <!-- 
      ⚠️ INSTRUÇÕES:
      1. Acesse: https://webmaster.yandex.com
      2. Adicione site: https://azmt.com.br
      3. Escolha método: "Meta tag"
      4. Copie o código e substitua "SEU_CODIGO_YANDEX_AQUI"
      5. Salve, commit, push, aguarde deploy
      6. Volte ao Yandex Webmaster e clique em "Verify"
    -->
    <!-- <meta name="yandex-verification" content="SEU_CODIGO_YANDEX_AQUI" /> -->
    
    <!-- 
      ALTERNATIVA: Usar variáveis de ambiente no Vercel
      Nome: VITE_GOOGLE_SEARCH_CONSOLE_VERIFICATION
      Nome: VITE_BING_WEBMASTER_VERIFICATION
      Nome: VITE_YANDEX_WEBMASTER_VERIFICATION
    -->
    
    <!-- ═══════════════════════════════════════════════════════════
        PERFORMANCE OPTIMIZATIONS - Resource Hints
        ═══════════════════════════════════════════════════════════ -->
    
    <!-- DNS Prefetch para domínios externos -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://img.youtube.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://plausible.io" />
    
    <!-- Preconnect para recursos críticos -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload de recursos críticos -->
    <link rel="preload" href="/logo-azimut-star.svg" as="image" type="image/svg+xml" />
    <!-- Favicon PNG não precisa de preload - navegador carrega automaticamente -->
    
    <!-- Preload de fontes críticas (melhor LCP) -->
    <link rel="preload" href="/fonts/HandelGothic-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Inter-VariableFont.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Sora-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin />
    
    <!-- Prefetch de rotas prováveis (melhor navegação) -->
    <link rel="prefetch" href="/work" />
    <link rel="prefetch" href="/what" />
    <link rel="prefetch" href="/contact" />
    <link rel="prefetch" href="/academy" />
    <link rel="prefetch" href="/studio" />
    <link rel="prefetch" href="/blog" />
    <link rel="prefetch" href="/vancouver" />
    
    <!-- RSS Feed - Auto-discovery -->
    <link rel="alternate" type="application/rss+xml" title="Azimut - Projetos e Notícias" href="https://azmt.com.br/feed.xml" />
    
    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#c92337" />
    <!-- Novo padrão (recomendado) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Deprecated: mantido para compatibilidade com iOS antigo -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Schema.org JSON-LD será injetado dinamicamente pelo React (SchemaOrganization.tsx) -->
  </head>
  <body class="bg-azimut-bg text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
